        let currentView = 'home';

        function getExamStatus(exam) {
            const now = new Date();
            const start = new Date(exam.startTime);
            const end = new Date(exam.endTime);
            if (now < start) return "UPCOMING";
            if (now >= start && now <= end) return "LIVE";
            return "ENDED";
        }

        // Time format tools
        function formatBanglaDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function getCountdown(targetIso) {
            const now = new Date().getTime();
            const target = new Date(targetIso).getTime();
            const diff = target - now;

            if (diff <= 0) return { expired: true, text: "00h 00m 00s" };

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            let str = days > 0 ? `${days}d ` : "";
            str += `${String(hours).padStart(2, '0')}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;
            return { expired: false, text: str };
        }

                    </h1>
                    <p class="text-slate-400 text-sm max-w-2xl mx-auto mb-8">
                        HSC Science & General Subjects-এর অধ্যায়ভিত্তিক অনলাইন পরীক্ষা। নির্দিষ্ট সময়ে পরীক্ষায় অংশ নিয়ে নিজের প্রস্তুতি যাচাই করুন।
                    </p>
                    <div class="flex flex-wrap justify-center gap-4">
                        <button onclick="navigateTo('subjects')" class="px-6 py-3 rounded-xl bg-primary hover:bg-primaryHover text-white font-semibold text-sm shadow-lg shadow-primary/25 transition">
                            📚 Browse All Chapters
                        </button>
                    </div>
                </section>

                <!-- 🔴 LIVE NOW -->
                <section class="mb-12">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-bold text-white flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full bg-liveRed animate-pulse"></span> 🔴 LIVE NOW
                        </h2>
                    </div>
                    ${liveExams.length > 0 ? `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${liveExams.map(ex => renderExamCard(ex)).join('')}
                        </div>
                    ` : `
                        <div class="glass-panel p-6 rounded-2xl text-center border-slate-800">
                            <p class="text-sm text-slate-400">এই মুহূর্তে কোনো পরীক্ষা লাইভ নেই। Upcoming এক্সাম তালিকা চেক করুন।</p>
                        </div>
                    `}
                </section>

                <!-- ⏳ UPCOMING -->
                <section class="mb-12">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-bold text-white">⏳ UPCOMING EXAMS</h2>
                    </div>
                    ${upcomingExams.length > 0 ? `
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${upcomingExams.map(ex => renderExamCard(ex)).join('')}
                        </div>
                    ` : `
                        <p class="text-sm text-slate-500 italic">No upcoming exams scheduled.</p>
                    `}
                </section>

                <!-- 📚 QUICK SUBJECTS -->
                <section class="mb-8">
                    <h2 class="text-xl font-bold text-white mb-4">📚 ALL SUBJECTS</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                        ${Object.values(subjectsData).map(subj => `
                            <div onclick="navigateTo('subjects', '${subj.id}')" class="glass-card p-4 rounded-xl cursor-pointer flex items-center gap-3">
                                <span class="text-2xl">${subj.icon}</span>
                                <div>
                                    <h4 class="text-sm font-bold text-white">${subj.name}</h4>
                                    <span class="text-[10px] text-mutedText">${subj.chapters.length} Chapters</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;
        }

        /* --- Exam Card Component --- */
        function renderExamCard(exam) {
            const status = getExamStatus(exam);
            let badgeStyle = "bg-slate-800 text-slate-400";
            let actionBtn = "";
            let timerHtml = "";

            if (status === "LIVE") {
                badgeStyle = "bg-liveRed/20 text-liveRed border-liveRed/40 animate-pulse";
                timerHtml = `<div class="mb-3 text-xs text-center font-mono text-liveRed font-semibold" data-countdown="${exam.endTime}">Ends in: Calculating...</div>`;
                actionBtn = `<a href="${exam.examUrl}" target="_blank" class="w-full block text-center py-2.5 rounded-xl bg-liveRed text-white font-bold text-xs shadow-lg shadow-liveRed/30 hover:bg-red-600 transition">🚀 ENTER EXAM</a>`;
            } else if (status === "UPCOMING") {
                badgeStyle = "bg-indigo-500/20 text-indigo-400 border-indigo-500/40";
                timerHtml = `<div class="mb-3 text-xs text-center font-mono text-indigo-400 font-semibold" data-countdown="${exam.startTime}">Starts in: Calculating...</div>`;
                actionBtn = `<button disabled class="w-full py-2.5 rounded-xl bg-slate-800 text-slate-500 font-bold text-xs cursor-not-allowed">Starts Soon</button>`;
            } else {
                badgeStyle = "bg-slate-800 text-slate-400";
                actionBtn = `<a href="${exam.examUrl}" target="_blank" class="w-full block text-center py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition">Practice Mode</a>`;
            }

            return `
                <div class="glass-card p-5 rounded-2xl flex flex-col justify-between ${status === 'LIVE' ? 'border-liveRed/50' : ''}">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="px-2 py-1 rounded text-[10px] font-bold border ${badgeStyle}">${status}</span>
                            <span class="text-[11px] text-mutedText">${exam.subject}</span>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-1">${exam.title}</h3>
                        <p class="text-xs text-indigo-400 mb-3">${exam.chapter}</p>
                        <div class="text-[11px] text-slate-400 mb-4 bg-slate-900/50 p-2 rounded-lg">
                            ${exam.totalQuestions} Questions • ${exam.duration} Minutes
                        </div>
                    </div>
                    <div>
                        ${timerHtml}
                        ${actionBtn}
                    </div>
                </div>
            `;
        }

        /* --- View: EXAMS DIRECTORY --- */
        function renderExamsView(container) {
            container.innerHTML = `
                <h1 class="text-2xl font-bold text-white mb-6">All Exams Directory</h1>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${examsData.length > 0 ? examsData.map(ex => renderExamCard(ex)).join('') : '<p class="text-slate-400">কোনো পরীক্ষা যুক্ত করা হয়নি।</p>'}
                </div>
            `;
        }

        /* --- View: SUBJECTS & CHAPTERS --- */
        function renderSubjectsView(container, activeSubjectId = null) {
            const selectedSubjId = activeSubjectId || Object.keys(subjectsData)[0];
            const currentSubj = subjectsData[selectedSubjId];

            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Left: Subject List -->
                    <div class="space-y-2">
                        <h2 class="text-lg font-bold text-white mb-3">Subjects</h2>
                        <div class="space-y-1 max-h-[75vh] overflow-y-auto pr-2">
                            ${Object.values(subjectsData).map(subj => `
                                <button onclick="renderSubjectsView(document.getElementById('mainContent'), '${subj.id}')" class="w-full text-left p-3 rounded-xl transition flex items-center justify-between ${subj.id === selectedSubjId ? 'bg-primary text-white font-bold' : 'glass-panel text-slate-300 hover:bg-white/5'}">
                                    <div class="flex items-center gap-3">
                                        <span class="text-lg">${subj.icon}</span>
                                        <span class="text-sm">${subj.name}</span>
                                    </div>
                                    <i data-lucide="chevron-right" class="w-4 h-4 opacity-70"></i>
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Right: Chapters & Links -->
                    <div class="lg:col-span-2 space-y-4">
                        <div class="glass-panel p-5 rounded-2xl flex items-center gap-3 mb-2">
                            <span class="text-3xl">${currentSubj.icon}</span>
                            <div>
                                <h1 class="text-2xl font-bold text-white">${currentSubj.name}</h1>
                                <span class="text-xs text-mutedText">${currentSubj.chapters.length} Chapters in total</span>
                            </div>
                        </div>

                        <div class="space-y-3">
                            ${currentSubj.chapters.map((chapterName, idx) => {
                                // Find if this chapter has an exam linked
                                const chapterExams = examsData.filter(e => e.subjectId === selectedSubjId && e.chapter === chapterName);
                                
                                let examHtml = '';
                                if(chapterExams.length > 0) {
                                    examHtml = chapterExams.map(ex => {
                                        const st = getExamStatus(ex);
                                        const btnClass = st === "UPCOMING" ? "bg-slate-700 text-slate-400 cursor-not-allowed" : (st === "LIVE" ? "bg-liveRed hover:bg-red-600 text-white" : "bg-primary hover:bg-primaryHover text-white");
                                        const btnText = st === "UPCOMING" ? "Upcoming" : (st === "LIVE" ? "Live Now" : "Practice Exam");
                                        const btnTag = st === "UPCOMING" ? `<button disabled class="px-4 py-1.5 rounded-lg text-xs font-bold ${btnClass}">${btnText}</button>` : `<a href="${ex.examUrl}" target="_blank" class="px-4 py-1.5 rounded-lg text-xs font-bold ${btnClass} transition block text-center">${btnText}</a>`;
                                        
                                        return `
                                            <div class="mt-3 p-3 bg-slate-900/80 border border-slate-800 rounded-lg flex flex-col sm:flex-row items-center justify-between gap-3">
                                                <div>
                                                    <span class="text-sm font-semibold text-white block">${ex.title}</span>
                                                    <span class="text-[10px] text-indigo-400">${st !== 'ENDED' ? 'Starts/Started: ' + formatBanglaDate(ex.startTime) : 'Ended, available for practice'}</span>
                                                </div>
                                                <div>${btnTag}</div>
                                            </div>
                                        `;
                                    }).join('');
                                } else {
                                    examHtml = `<div class="mt-2 text-[11px] text-slate-500 italic">No exam added yet.</div>`;
                                }

                                return `
                                    <div class="glass-panel p-4 rounded-xl border-slate-800/60">
                                        <h4 class="text-sm font-bold text-slate-200">
                                            <span class="text-primary mr-2">${String(idx + 1).padStart(2, '0')}.</span>${chapterName}
                                        </h4>
                                        ${examHtml}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        /* --- View: SCHEDULE --- */
        function renderScheduleView(container) {
            container.innerHTML = `
                <h1 class="text-2xl font-bold text-white mb-6">📅 Exam Schedule</h1>
                <div class="max-w-3xl space-y-4">
                    ${examsData.length > 0 ? examsData.map(exam => {
                        const st = getExamStatus(exam);
                        return `
                            <div class="glass-panel p-4 rounded-xl border border-slate-800 flex items-center justify-between">
                                <div>
                                    <h4 class="text-base font-bold text-white">${exam.title}</h4>
                                    <p class="text-xs text-indigo-400 mb-1">${exam.subject} • ${exam.chapter}</p>
                                    <p class="text-[11px] text-slate-400">Start: ${formatBanglaDate(exam.startTime)} | End: ${formatBanglaDate(exam.endTime)}</p>
                                </div>
                                <span class="px-3 py-1 rounded text-[10px] font-bold ${st === 'LIVE' ? 'bg-liveRed/20 text-liveRed' : (st === 'UPCOMING' ? 'bg-indigo-500/20 text-indigo-400' : 'bg-slate-800 text-slate-400')}">
                                    ${st}
                                </span>
                            </div>
                        `;
                    }).join('') : '<p class="text-slate-400">কোনো পরীক্ষা নির্ধারিত নেই।</p>'}
                </div>
            `;
        }

        /* --- Timer & Auto Refresh Logic --- */
        function updateLastStatuses() {
            examsData.forEach(ex => { lastKnownStatuses[ex.id] = getExamStatus(ex); });
        }

        function startCountdownTimers() {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                // Update countdown texts
                document.querySelectorAll('[data-countdown]').forEach(el => {
                    const targetIso = el.getAttribute('data-countdown');
                    const isLive = el.innerText.includes('Ends');
                    const prefix = isLive ? 'Ends in: ' : 'Starts in: ';
                    el.innerText = prefix + getCountdown(targetIso).text;
                });

                // Auto state change detector (UPCOMING -> LIVE -> ENDED)
                let statusChanged = false;
                examsData.forEach(ex => {
                    const currentSt = getExamStatus(ex);
                    if (lastKnownStatuses[ex.id] !== currentSt) {
                        statusChanged = true;
                    }
                });

                // If time crosses a boundary, automatically refresh the view
                if (statusChanged) {
                    refreshCurrentView();
                }

            }, 1000);
        }

        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        }

        // Init
        window.addEventListener('DOMContentLoaded', () => {
            navigateTo('home');
        });
    </script>
</body>
</html>
